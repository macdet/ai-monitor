[project]
name = "ai-monitor"
version = "0.1.0"
description = "AI System Monitor for Ollama, Docker and GPU"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "requests>=2.33.1",
    "rich>=14.3.3",
    "schedule>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
